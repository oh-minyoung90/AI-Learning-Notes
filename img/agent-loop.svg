<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e9e6b"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="1" y="1" width="758" height="478" rx="14" fill="#f7f9fb" stroke="#dbe2ea" stroke-width="1.5"/>

  <!-- title -->
  <text x="380" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">AI Agent Loop</text>
  <text x="380" y="64" text-anchor="middle" font-size="12.5" fill="#6b7885">목표를 받아 &#8220;계획 &#8594; 행동 &#8594; 관찰 &#8594; 판단&#8221;을 반복한다</text>

  <!-- User Goal -->
  <rect x="40" y="210" width="120" height="60" rx="10" fill="#eef2f7" stroke="#c3cedb" stroke-width="1.5"/>
  <text x="100" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">사용자 목표</text>
  <text x="100" y="255" text-anchor="middle" font-size="11" fill="#6b7885">Goal / Task</text>

  <!-- LLM core (center) -->
  <circle cx="380" cy="245" r="66" fill="#e7f0fb" stroke="#4a90d9" stroke-width="2"/>
  <text x="380" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c4f82">LLM</text>
  <text x="380" y="257" text-anchor="middle" font-size="11.5" fill="#3a6ea5">추론 엔진</text>
  <text x="380" y="273" text-anchor="middle" font-size="10.5" fill="#3a6ea5">(Reasoning)</text>

  <!-- Plan (top) -->
  <rect x="300" y="110" width="160" height="52" rx="10" fill="#fff4e6" stroke="#e0a458" stroke-width="1.5"/>
  <text x="380" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a15">① 계획 (Plan)</text>
  <text x="380" y="150" text-anchor="middle" font-size="10.5" fill="#a06a20">할 일을 단계로 분해</text>

  <!-- Action (right) -->
  <rect x="560" y="150" width="160" height="60" rx="10" fill="#eaf6ef" stroke="#57b989" stroke-width="1.5"/>
  <text x="640" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">② 행동 (Act)</text>
  <text x="640" y="194" text-anchor="middle" font-size="10.5" fill="#2e9e6b">도구 호출 / Tool Use</text>

  <!-- Observation (bottom) -->
  <rect x="300" y="380" width="160" height="52" rx="10" fill="#f0ecfb" stroke="#8b6fc7" stroke-width="1.5"/>
  <text x="380" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#573a94">③ 관찰 (Observe)</text>
  <text x="380" y="420" text-anchor="middle" font-size="10.5" fill="#6e52ad">실행 결과 확인</text>

  <!-- Reflect (left) -->
  <rect x="560" y="290" width="160" height="60" rx="10" fill="#fdecec" stroke="#d98080" stroke-width="1.5"/>
  <text x="640" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#a33b3b">④ 판단 (Reflect)</text>
  <text x="640" y="334" text-anchor="middle" font-size="10.5" fill="#c25757">완료? 재시도? 수정?</text>

  <!-- Memory & Tools sidebars -->
  <rect x="40" y="330" width="120" height="52" rx="10" fill="#eef2f7" stroke="#c3cedb" stroke-width="1.5"/>
  <text x="100" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">메모리</text>
  <text x="100" y="370" text-anchor="middle" font-size="10.5" fill="#6b7885">Memory</text>

  <rect x="40" y="98" width="120" height="52" rx="10" fill="#eef2f7" stroke="#c3cedb" stroke-width="1.5"/>
  <text x="100" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">도구 집합</text>
  <text x="100" y="138" text-anchor="middle" font-size="10.5" fill="#6b7885">Tools / API</text>

  <!-- edges: goal -> LLM -->
  <path d="M160,240 L312,245" fill="none" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LLM -> Plan -->
  <path d="M380,179 L380,164" fill="none" stroke="#e0a458" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Plan -> Action -->
  <path d="M460,140 C540,140 560,160 585,150" fill="none" stroke="#57b989" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <!-- Action -> Observe -->
  <path d="M640,210 C640,320 500,406 462,406" fill="none" stroke="#8b6fc7" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Observe -> Reflect -->
  <path d="M460,400 C540,388 560,340 585,325" fill="none" stroke="#d98080" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Reflect -> LLM (loop back) -->
  <path d="M600,300 C500,255 470,248 448,246" fill="none" stroke="#5b6b7c" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="512" y="270" font-size="10.5" fill="#5b6b7c" font-style="italic">반복 (loop)</text>

  <!-- Tools <-> Action link (dashed) -->
  <path d="M160,120 C230,120 250,175 300,140" fill="none" stroke="#9aa7b4" stroke-width="1.3" stroke-dasharray="4,4"/>
  <!-- Memory <-> LLM link (dashed) -->
  <path d="M160,352 C240,352 280,300 316,272" fill="none" stroke="#9aa7b4" stroke-width="1.3" stroke-dasharray="4,4"/>

  <!-- exit: Reflect -> Done -->
  <rect x="560" y="392" width="160" height="46" rx="10" fill="#e7f0fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="640" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c4f82">완료 &#8594; 최종 응답</text>
  <path d="M640,350 L640,388" fill="none" stroke="#4a90d9" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="650" y="374" font-size="10" fill="#3a6ea5" font-style="italic">목표 달성 시</text>
</svg>
