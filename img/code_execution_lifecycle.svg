<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">코드 실행 생명주기 (Worker Lifecycle)</text>

  <!-- Step boxes -->
  <rect x="60" y="70" width="180" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">① 코드 전달</text>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#0c4a6e">Agent가 실행할 코드를 보냄</text>

  <rect x="340" y="70" width="180" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">② Worker 생성</text>
  <text x="430" y="118" text-anchor="middle" font-size="11" fill="#15803d">Sandbox 안에 실행기 준비</text>

  <rect x="620" y="70" width="180" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="710" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">③ 코드 실행</text>
  <text x="710" y="118" text-anchor="middle" font-size="11" fill="#4338ca">격리된 채로 실행·로그 수집</text>

  <rect x="620" y="200" width="180" height="66" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="710" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">④ 결과 반환</text>
  <text x="710" y="248" text-anchor="middle" font-size="11" fill="#713f12">출력·에러를 Agent로 전달</text>

  <!-- arrows top row -->
  <line x1="240" y1="103" x2="335" y2="103" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="520" y1="103" x2="615" y2="103" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="710" y1="136" x2="710" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Branch decision -->
  <path d="M710,266 L710,300 L430,300 L430,330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="330" y="330" width="200" height="54" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">이어서 할 작업이 있나?</text>
  <text x="430" y="370" text-anchor="middle" font-size="11" fill="#c2410c">(사용자 승인·추가 입력 등)</text>

  <!-- Stateless branch -->
  <path d="M330,357 L150,357 L150,410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="230" y="348" text-anchor="middle" font-size="11" fill="#475569">아니오</text>
  <rect x="40" y="410" width="220" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⑤a Stateless — 즉시 종료</text>
  <text x="150" y="457" text-anchor="middle" font-size="11" fill="#b91c1c">Worker 파기, 자원 회수</text>
  <text x="150" y="474" text-anchor="middle" font-size="11" fill="#b91c1c">다음 요청은 새 Worker에서</text>

  <!-- Stateful branch -->
  <path d="M530,357 L710,357 L710,410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="620" y="348" text-anchor="middle" font-size="11" fill="#475569">예</text>
  <rect x="600" y="410" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">⑤b Stateful — 유지</text>
  <text x="710" y="457" text-anchor="middle" font-size="11" fill="#15803d">Session ID로 상태 보존</text>
  <text x="710" y="474" text-anchor="middle" font-size="11" fill="#15803d">같은 환경으로 재개</text>
</svg>
