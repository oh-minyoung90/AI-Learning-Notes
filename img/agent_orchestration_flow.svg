<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Agent Routing / Orchestration 실행 흐름</text>

  <!-- User -->
  <rect x="40" y="70" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">사용자</text>
  <text x="115" y="118" text-anchor="middle" font-size="12" fill="#0c4a6e">User Prompt</text>

  <!-- Orchestrator -->
  <rect x="290" y="60" width="280" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="430" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Orchestrator</text>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#4338ca">① 의도 분석</text>
  <text x="430" y="130" text-anchor="middle" font-size="12" fill="#4338ca">② 적합 Agent 탐색·선택 (Routing)</text>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#4338ca">③ 접근 권한 확인</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#4338ca">④ Runtime로 실행 요청</text>

  <!-- Registry -->
  <rect x="660" y="70" width="160" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="740" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Agent Registry</text>
  <text x="740" y="118" text-anchor="middle" font-size="11" fill="#713f12">등록된 Agent 목록</text>
  <text x="740" y="136" text-anchor="middle" font-size="11" fill="#713f12">역할·지침·권한</text>
  <text x="740" y="154" text-anchor="middle" font-size="11" fill="#713f12">메타데이터</text>

  <!-- Runtime / Sandbox -->
  <rect x="290" y="250" width="280" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="430" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Runtime / Sandbox</text>
  <text x="430" y="300" text-anchor="middle" font-size="12" fill="#15803d">격리된 실행 환경</text>

  <!-- Agent inside -->
  <rect x="320" y="312" width="220" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">선택된 Agent</text>
  <text x="430" y="349" text-anchor="middle" font-size="11" fill="#15803d">지침 + Skill + Tool 로 Plan 수립·수행</text>

  <!-- Handoff box -->
  <rect x="620" y="255" width="200" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Handoff (재선택)</text>
  <text x="720" y="304" text-anchor="middle" font-size="11" fill="#991b1b">결과 부적합/실패 시</text>
  <text x="720" y="322" text-anchor="middle" font-size="11" fill="#991b1b">Orchestrator가</text>
  <text x="720" y="340" text-anchor="middle" font-size="11" fill="#991b1b">다른 Agent 재선택</text>

  <!-- Arrows -->
  <!-- user -> orchestrator -->
  <line x1="190" y1="100" x2="285" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- orchestrator <-> registry -->
  <line x1="570" y1="110" x2="655" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="140" x2="570" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBack)"/>
  <text x="612" y="103" text-anchor="middle" font-size="10" fill="#64748b">조회</text>
  <!-- orchestrator -> runtime -->
  <line x1="430" y1="180" x2="430" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="218" text-anchor="middle" font-size="11" fill="#475569">실행 요청</text>
  <!-- runtime -> orchestrator (result) -->
  <line x1="480" y1="245" x2="480" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowBack)"/>
  <text x="540" y="218" text-anchor="middle" font-size="11" fill="#64748b">결과 반환</text>
  <!-- runtime -> handoff -->
  <line x1="570" y1="310" x2="615" y2="310" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <!-- handoff -> orchestrator -->
  <path d="M720,255 C720,210 660,120 575,118" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- result to user -->
  <path d="M290,140 C240,150 210,180 200,240 C195,300 250,320 315,330" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="115" y1="130" x2="115" y2="240" stroke="#0284c7" stroke-width="0" />

  <!-- final result arrow to user -->
  <rect x="40" y="300" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">최종 결과</text>
  <text x="115" y="348" text-anchor="middle" font-size="12" fill="#0c4a6e">사용자에게 반환</text>
  <line x1="315" y1="335" x2="195" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBack)"/>

  <!-- caption -->
  <text x="430" y="430" text-anchor="middle" font-size="12" fill="#64748b">1단계: 질의당 Agent 1개 선택·실행(Routing) · 부적합 시 Handoff로 재선택</text>
  <text x="430" y="452" text-anchor="middle" font-size="12" fill="#64748b">Orchestrator의 Plan = "어떤 Agent를 실행할까" / Agent의 Plan = "요청을 어떻게 해결할까"</text>
</svg>
